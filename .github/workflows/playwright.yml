name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: 1. Obtener código del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: 3. Instalar dependencias del proyecto
      run: npm ci

    - name: 4. Instalar navegadores de Playwright con sus dependencias de SO
      run: npx playwright install --with-deps

    - name: 5. Ejecutar pruebas de Playwright
      run: npx playwright test

    - name: 6. Guardar reporte HTML como artefacto
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30